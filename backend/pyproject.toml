[project]
name = "docchat-backend"
version = "0.1.0"
description = "DocChat backend: chat with your PDFs using RAG"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.2.0",
    # Listed directly (sentence-transformers already needs it) so it can come from the CPU index
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

# CPU-only PyTorch: on Linux (Docker) the default PyPI build bundles several GB of GPU libraries
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes (errors, unused imports), I = import sorting,
# UP = modern Python syntax, B = common bug patterns
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests do `from app.main import app` without installing the package
pythonpath = ["."]
