[project]
name = "docchat-backend"
version = "0.1.0"
description = "DocChat backend: chat with your PDFs using RAG"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes (errors, unused imports), I = import sorting,
# UP = modern Python syntax, B = common bug patterns
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests do `from app.main import app` without installing the package
pythonpath = ["."]
